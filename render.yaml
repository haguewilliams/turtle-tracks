# Staging setup only. Creating this file does not create or activate a service.
# This free starter has no persistent volume. Keep integrations off until durable
# hosting/storage is approved and configured; see DEPLOYMENT.md.
services:
  - type: web
    name: turtle-tracks
    runtime: node
    plan: free
    repo: https://github.com/haguewilliams/turtle-tracks
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm test
    startCommand: node server.mjs
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ANALYSIS_DAILY_LIMIT
        value: "0"
      - key: INAT_ENABLED
        value: "false"
      - key: TT_DATA_DURABLE
        value: "false"
